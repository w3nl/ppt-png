name: Node Test

on: [push]

jobs:
  build:

    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install LibreOffice, ImageMagick and Ghostscript
      run: choco install libreoffice-fresh imagemagick ghostscript -y --no-progress
    - name: Add LibreOffice to PATH
      run: echo "C:\Program Files\LibreOffice\program" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: npm test
      run: |
        npm ci
        npm test
      env:
        CI: true
